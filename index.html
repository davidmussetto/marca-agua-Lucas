<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Marca de agua en PDF</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h1>Agregar marca de agua a PDF</h1>
    <form action="WatermarkServlet" method="post" enctype="multipart/form-data">
        <label>Seleccionar PDF</label>
        <input type="file" name="pdf" accept="application/pdf" required>

        <label>Texto de la marca de agua</label>
        <input type="text" name="watermark" required>

        <button type="submit">Procesar PDF</button>
    </form>
</div>
</body>
</html>
